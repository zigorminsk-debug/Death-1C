# Сборка установщика программы «Очистка сеансов 1С».
#
# Каждая сборка получает ПОРЯДКОВЫЙ НОМЕР — github.run_number: он растёт на
# единицу с каждым запуском рабочего процесса и попадает
#   - в exe-файл (свойства файла и окно «О программе»),
#   - в имя установщика SessionCleaner-Setup-<номер>.exe,
#   - в имя артефакта загрузки.
#
# Сборка идёт только в GitHub Actions: локальная сборка не требуется.
#
# Если шаг падает, шаг «отчёт об ошибке» публикует вывод (gofmt -d, go vet,
# go test, go build, makensis) комментарием к коммиту, чтобы диагностику
# можно было прочитать через API GitHub.

name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  # write нужен, чтобы шаг «отчёт об ошибке» мог опубликовать диагностику
  # комментарием к коммиту, а релиз-шаг — прикрепить файлы к тегу.
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # Проверка кода и тесты на Linux (быстрая обратная связь).
  # ---------------------------------------------------------------------
  check:
    name: go vet / test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "$out"; echo "::error::gofmt: файлы не отформатированы"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1

      - name: отчёт об ошибке
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### gofmt -d"
            gofmt -d . 2>&1 || true
            echo
            echo "### go vet ./..."
            go vet ./... 2>&1 || true
            echo
            echo "### go test ./... -count=1"
            go test ./... -count=1 2>&1 || true
          } > ci-report.txt || true
          tail -c 55000 ci-report.txt | jq -Rs '{body: ("**check job failed**\n```diff\n" + . + "\n```")}' > payload.json
          gh api -X POST "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" --input payload.json

  # ---------------------------------------------------------------------
  # Основная сборка: Windows, ресурсы exe, NSIS-установщик, артефакты.
  # ---------------------------------------------------------------------
  build:
    name: build windows + installer
    runs-on: windows-latest
    needs: check
    env:
      APP_VERSION: "1.0.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Номер сборки
        id: buildno
        shell: bash
        run: |
          echo "number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "commit=$(echo ${GITHUB_SHA} | cut -c1-8)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Тесты (windows)
        shell: bash
        run: go test ./... -count=1 2>&1 | tee -a ci.log

      - name: go-winres
        shell: bash
        run: go install github.com/tc-hib/go-winres@latest 2>&1 | tee -a ci.log

      - name: Ресурсы exe (иконка, манифест, версия)
        shell: bash
        run: |
          # go-winres ищет каталог winres/ относительно текущей папки,
          # а пути файлов внутри winres.json — относительно самого json.
          cd build
          "$(go env GOPATH)/bin/go-winres" make \
            --arch amd64 \
            --file-version "${APP_VERSION}.${{ steps.buildno.outputs.number }}" \
            --product-version "${APP_VERSION}.${{ steps.buildno.outputs.number }}" 2>&1 | tee -a ../ci.log
          mv rsrc_windows_amd64.syso ../cmd/sessioncleaner/

      - name: Сборка SessionCleaner.exe
        shell: bash
        run: |
          mkdir -p build/out
          go build -trimpath -v \
            -ldflags "-H windowsgui -s -w \
              -X github.com/zigorminsk-debug/death-1c/internal/buildinfo.Version=${APP_VERSION} \
              -X github.com/zigorminsk-debug/death-1c/internal/buildinfo.Build=${{ steps.buildno.outputs.number }} \
              -X github.com/zigorminsk-debug/death-1c/internal/buildinfo.Commit=${{ steps.buildno.outputs.commit }} \
              -X github.com/zigorminsk-debug/death-1c/internal/buildinfo.Date=${{ steps.buildno.outputs.date }} \
              -X github.com/zigorminsk-debug/death-1c/internal/buildinfo.Channel=release" \
            -o build/out/SessionCleaner.exe ./cmd/sessioncleaner 2>&1 | tee -a ci.log

      - name: Проверка версии в exe
        shell: bash
        run: |
          ./build/out/SessionCleaner.exe -version | tee -a ci.log
          ./build/out/SessionCleaner.exe -version | grep -q "сборка ${{ steps.buildno.outputs.number }}"

      - name: NSIS (поиск или установка)
        shell: pwsh
        run: |
          $log = "ci.log"
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            "makensis не найден — ставим NSIS через chocolatey" | Tee-Object -FilePath $log -Append
            choco install nsis --yes --no-progress *>&1 | Tee-Object -FilePath $log -Append
            $profile = Join-Path $env:ChocolateyInstall "helpers\chocolateyProfile.psm1"
            if (Test-Path $profile) { Import-Module $profile; refreshenv }
          }
          $m = Get-Command makensis -ErrorAction SilentlyContinue
          if (-not $m) {
            foreach ($p in @("${env:ProgramFiles(x86)}\NSIS\makensis.exe", "$env:ProgramFiles\NSIS\makensis.exe")) {
              if (Test-Path $p) { $m = Get-Command $p; break }
            }
          }
          if (-not $m) { throw "makensis не найден ни в PATH, ни в Program Files" }
          "makensis: $($m.Source)" | Tee-Object -FilePath $log -Append
          "MAKENSIS_PATH=$($m.Source)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $m.Source -VERSION *>&1 | Tee-Object -FilePath $log -Append

      - name: Установщик (NSIS)
        shell: bash
        run: |
          MK="${MAKENSIS_PATH:-makensis}"
          "$MK" -V3 \
            -DAPP_VERSION=${APP_VERSION} \
            -DBUILD_NUMBER=${{ steps.buildno.outputs.number }} \
            -DOUT_DIR="$GITHUB_WORKSPACE/build/out" \
            installer/setup.nsi 2>&1 | tee -a ci.log
          ls -la build/out

      - name: Артефакты
        uses: actions/upload-artifact@v4
        with:
          name: SessionCleaner-build-${{ steps.buildno.outputs.number }}
          path: |
            build/out/SessionCleaner.exe
            build/out/SessionCleaner-Setup-${{ steps.buildno.outputs.number }}.exe
          if-no-files-found: error
          retention-days: 90

      - name: отчёт об ошибке
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 55000 ci.log > ci-tail.log || true
          jq -Rs '{body: ("**build job failed**\n```\n" + . + "\n```")}' ci-tail.log > payload.json
          gh api -X POST "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" --input payload.json

      # Публикация релиза — только для тегов v*: релиз получает тот же
      # порядковый номер сборки, что и exe-файл.
      - name: Release (только теги)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Очистка сеансов 1С ${{ env.APP_VERSION }} (сборка ${{ steps.buildno.outputs.number }})"
          files: |
            build/out/SessionCleaner-Setup-${{ steps.buildno.outputs.number }}.exe
            build/out/SessionCleaner.exe
          generate_release_notes: true
